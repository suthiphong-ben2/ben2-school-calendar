<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สรุปกิจกรรมรายเดือน — โรงเรียนเบญจมราชรังสฤษฎิ์ ๒</title>
<link rel="icon" type="image/png" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --navy:      #12315e;
    --navy-deep: #0b2247;
    --gold:      #f0b429;
    --gold-tint: #fff6e0;
    --paper:     #eef1f6;
    --line:      #d5dce8;
    --muted:     #5a6a85;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--paper); color: var(--navy);
    font-family: 'Sarabun', system-ui, sans-serif; line-height: 1.6;
  }

  /* ---------- แถบเครื่องมือ ไม่ติดไปกับรูปที่บันทึก ---------- */
  .toolbar {
    background: #fff; border-bottom: 1px solid var(--line);
    padding: 14px 18px; display: flex; flex-wrap: wrap;
    gap: 10px; align-items: flex-end; justify-content: center;
  }
  .toolbar .grp { display: flex; flex-direction: column; gap: 3px; }
  .toolbar label { font-size: .8rem; color: var(--muted); }
  .toolbar select, .toolbar input {
    font-family: inherit; font-size: .95rem; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px; color: var(--navy); background: #fff;
  }
  .toolbar input.term { width: 230px; }
  .btn {
    font-family: inherit; font-size: .93rem; font-weight: 600;
    padding: 9px 17px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--navy);
  }
  .btn.main { background: var(--gold); border-color: #d99f1c; color: var(--navy-deep); }
  .btn.main:hover { background: #ffc63f; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn:focus-visible, select:focus-visible, input:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 2px;
  }
  .note { text-align: center; color: var(--muted); font-size: .85rem; padding: 10px 16px 0; }

  /* ---------- ตัวโปสเตอร์ ขนาด A4 แนวตั้ง ---------- */
  .stage { padding: 22px 12px 60px; display: flex; justify-content: center; }

  #poster {
    width: 794px;            /* A4 กว้าง 210mm ที่ 96dpi */
    min-height: 1123px;      /* A4 สูง 297mm */
    background: #fff;
    display: flex; flex-direction: column;
    box-shadow: 0 2px 16px rgba(11, 34, 71, .15);
  }

  .p-head {
    background: var(--navy-deep);
    padding: 26px 34px 22px;
    border-bottom: 6px solid var(--gold);
    display: flex; align-items: center; gap: 20px;
  }
  .p-head .crest {
    width: 86px; height: 86px; flex: none;
    background: #fff; border-radius: 12px; padding: 8px;
    display: flex; align-items: center; justify-content: center;
  }
  .p-head .crest img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .p-head .crest.empty { display: none; }

  .p-head .txt { flex: 1 1 auto; color: #fff; min-width: 0; }
  .p-head .kicker {
    display: inline-block; background: var(--gold); color: var(--navy-deep);
    font-size: .78rem; font-weight: 600; letter-spacing: .06em;
    padding: 2px 12px; border-radius: 999px; margin-bottom: 7px;
  }
  .p-head h1 {
    font-family: 'Noto Serif Thai', serif; font-weight: 600;
    font-size: 1.45rem; margin: 0; line-height: 1.3;
  }
  .p-head .month {
    font-family: 'Noto Serif Thai', serif; font-weight: 700;
    font-size: 2.1rem; margin: 2px 0 0; line-height: 1.2; color: var(--gold);
  }
  .p-head .term { margin: 5px 0 0; font-size: .95rem; color: #c3d1e6; }

  .p-body { flex: 1 1 auto; padding: 26px 34px 20px; }

  table.sched { width: 100%; border-collapse: collapse; }
  table.sched th {
    background: var(--navy); color: #fff;
    font-family: 'Noto Serif Thai', serif; font-weight: 600; font-size: 1.02rem;
    padding: 11px 14px; text-align: left;
  }
  table.sched th.dcol { width: 215px; }
  table.sched td {
    border-bottom: 1px solid var(--line);
    padding: 11px 14px; vertical-align: top; font-size: .95rem;
  }
  table.sched tr:nth-child(even) td { background: #f8fafc; }
  table.sched td.date {
    white-space: nowrap; font-weight: 600;
    border-left: 4px solid var(--gold); background: var(--gold-tint) !important;
  }
  table.sched td .sub { display: block; color: var(--muted); font-size: .87rem; margin-top: 2px; }
  table.sched td .cat {
    display: inline-block; font-size: .76rem; color: #fff;
    padding: 1px 9px; border-radius: 999px; margin-bottom: 3px;
  }

  .p-empty {
    border: 1px dashed var(--line); border-radius: 10px;
    padding: 50px 20px; text-align: center; color: var(--muted);
  }

  .p-foot {
    border-top: 2px solid var(--line);
    margin: 0 34px; padding: 13px 0 22px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px; flex-wrap: wrap;
    font-size: .85rem; color: var(--muted);
  }
  .p-foot .right { text-align: right; }

  /* ---------- ตอนสั่งพิมพ์ ---------- */
  @media print {
    @page { size: A4 portrait; margin: 0; }
    body { background: #fff; }
    .toolbar, .note, .stage { padding: 0; }
    .toolbar, .note { display: none !important; }
    #poster { width: 100%; min-height: auto; box-shadow: none; }
    table.sched tr { break-inside: avoid; }
    .p-head { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  @media (max-width: 860px) {
    .stage { padding: 14px 8px 40px; }
    #poster { width: 100%; min-height: auto; }
    .p-head { padding: 18px; gap: 14px; }
    .p-head .crest { width: 60px; height: 60px; }
    .p-head .month { font-size: 1.6rem; }
    .p-body { padding: 18px; }
    table.sched th.dcol { width: 130px; }
    .p-foot { margin: 0 18px; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="grp">
    <label for="selMonth">เดือน</label>
    <select id="selMonth"></select>
  </div>
  <div class="grp">
    <label for="selYear">ปี พ.ศ.</label>
    <select id="selYear"></select>
  </div>
  <div class="grp">
    <label for="inpTerm">ภาคเรียน แก้ข้อความได้</label>
    <input type="text" class="term" id="inpTerm">
  </div>
  <button class="btn main" id="btnPng" type="button">บันทึกเป็นรูป</button>
  <button class="btn" id="btnPdf" type="button">บันทึกเป็น PDF</button>
  <button class="btn" id="btnBack" type="button" onclick="location.href='index.html'">กลับหน้าปฏิทิน</button>
</div>

<p class="note" id="note">กำลังโหลดข้อมูลกิจกรรม</p>

<div class="stage">
  <div id="poster">
    <div class="p-head">
      <span class="crest" id="crest">
        <img src="logo.png" alt="ตราโรงเรียนเบญจมราชรังสฤษฎิ์ ๒"
             onerror="document.getElementById('crest').classList.add('empty')">
      </span>
      <div class="txt">
        <span class="kicker">CALENDAR</span>
        <h1>ปฏิทินโรงเรียนเบญจมราชรังสฤษฎิ์ ๒</h1>
        <p class="month" id="pMonth">&nbsp;</p>
        <p class="term" id="pTerm">&nbsp;</p>
      </div>
    </div>

    <div class="p-body">
      <table class="sched" id="tbl">
        <thead><tr><th class="dcol">วันที่</th><th>กิจกรรม</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="p-empty" id="empty" style="display:none">เดือนนี้ยังไม่มีกิจกรรมในระบบ</div>
    </div>

    <div class="p-foot">
      <span>กลุ่มบริหารวิชาการ โรงเรียนเบญจมราชรังสฤษฎิ์ ๒</span>
      <span class="right" id="pStamp"></span>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function () {
  // ============ แก้บรรทัดนี้บรรทัดเดียว ============
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxFrKxA4KBQujrKBI9gcDOVOuSf-BuIXJ31lY0SfdpLQmjlYMfH6ob9StOUgYQuC_xN/exec?api=events';
  // ===============================================

  var MONTH_FULL = ['', 'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
                    'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];

  var all = [];
  var $ = function (id) { return document.getElementById(id); };

  function pad(n) { return ('0' + n).slice(-2); }

  function shiftDay(s, n) {
    var p = s.split('-');
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    d.setDate(d.getDate() + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  /** ช่วงวันจริงของกิจกรรม ฟีดส่งวันสิ้นสุดแบบไม่รวมวันนั้นเมื่อเป็นกิจกรรมตลอดวัน */
  function rangeOf(e) {
    var s = e.start.slice(0, 10);
    var en = e.end ? e.end.slice(0, 10) : s;
    if (e.allDay) en = shiftDay(en, -1);
    if (en < s) en = s;
    return [s, en];
  }

  /** แตกช่วงออกเป็นรายวัน เพื่อให้รวมกิจกรรมชื่อเดียวกันได้ */
  function daysOf(e) {
    var r = rangeOf(e), out = [], cur = r[0];
    var guard = 0;
    while (cur <= r[1] && guard++ < 400) { out.push(cur); cur = shiftDay(cur, 1); }
    return out;
  }

  /** เปลี่ยนรายวันเป็นข้อความอ่านง่าย เช่น 1 - 5 กันยายน 2569 หรือ 21, 23, 25 กันยายน 2569 */
  function dateText(days) {
    days = days.slice().sort();
    var runs = [], cur = [days[0]];
    for (var i = 1; i < days.length; i++) {
      if (days[i] === shiftDay(days[i - 1], 1)) { cur.push(days[i]); }
      else { runs.push(cur); cur = [days[i]]; }
    }
    runs.push(cur);

    var months = {};
    days.forEach(function (d) { months[d.slice(0, 7)] = true; });
    var oneMonth = Object.keys(months).length === 1;

    function dd(d) { return String(Number(d.slice(8, 10))); }
    function mm(d) { return MONTH_FULL[Number(d.slice(5, 7))]; }
    function yy(d) { return String(Number(d.slice(0, 4)) + 543); }

    var parts = runs.map(function (r) {
      var a = r[0], b = r[r.length - 1];
      if (a === b) return oneMonth ? dd(a) : dd(a) + ' ' + mm(a);
      if (a.slice(0, 7) === b.slice(0, 7)) {
        return oneMonth ? dd(a) + ' - ' + dd(b) : dd(a) + ' - ' + dd(b) + ' ' + mm(a);
      }
      return dd(a) + ' ' + mm(a) + ' - ' + dd(b) + ' ' + mm(b);
    });

    var last = days[days.length - 1];
    var tail = oneMonth ? ' ' + mm(last) + ' ' + yy(last) : ' ' + yy(last);
    return parts.join(', ') + tail;
  }

  function guessTerm(ce, m) {
    // ภาคเรียนที่ 1 ราวเดือน พ.ค. ถึง ต.ค. ที่เหลือเป็นภาคเรียนที่ 2
    var be = ce + 543;
    if (m >= 5 && m <= 10) return 'ภาคเรียนที่ 1 ปีการศึกษา ' + be;
    if (m >= 11) return 'ภาคเรียนที่ 2 ปีการศึกษา ' + be;
    return 'ภาคเรียนที่ 2 ปีการศึกษา ' + (be - 1);
  }

  function draw() {
    var m  = Number($('selMonth').value);
    var ce = Number($('selYear').value) - 543;
    var from = ce + '-' + pad(m) + '-01';
    var to   = shiftDay(ce + '-' + pad(m === 12 ? 1 : m + 1) + '-01', -1);
    if (m === 12) to = ce + '-12-31';

    $('pMonth').textContent = 'เดือน' + MONTH_FULL[m];
    $('pTerm').textContent  = $('inpTerm').value;

    // รวมกิจกรรมชื่อเดียวกันที่จัดหลายวัน ให้เป็นแถวเดียว
    var groups = {};
    all.forEach(function (e) {
      var inMonth = daysOf(e).filter(function (d) { return d >= from && d <= to; });
      if (!inMonth.length) return;

      var p = e.extendedProps || {};
      var key = e.title + '||' + (p.location || '');
      if (!groups[key]) {
        groups[key] = { title: e.title, color: e.color, cat: p.category || '',
                        loc: p.location || '', detail: p.detail || '', days: [] };
      }
      groups[key].days = groups[key].days.concat(inMonth);
    });

    var rows = Object.keys(groups).map(function (k) { return groups[k]; })
      .filter(function (g) { return g.days.length; })
      .sort(function (a, b) {
        var x = a.days.slice().sort()[0], y = b.days.slice().sort()[0];
        return x < y ? -1 : (x > y ? 1 : 0);
      });

    var tb = $('tbody');
    tb.innerHTML = '';
    $('tbl').style.display = rows.length ? '' : 'none';
    $('empty').style.display = rows.length ? 'none' : '';

    rows.forEach(function (g) {
      var tr = document.createElement('tr');

      var td1 = document.createElement('td');
      td1.className = 'date';
      td1.textContent = dateText(g.days);

      var td2 = document.createElement('td');
      if (g.cat) {
        var cat = document.createElement('span');
        cat.className = 'cat';
        cat.style.background = g.color || '#12315e';
        cat.textContent = g.cat;
        td2.appendChild(cat);
        td2.appendChild(document.createElement('br'));
      }
      td2.appendChild(document.createTextNode(g.title));

      var extra = [];
      if (g.loc) extra.push('ณ ' + g.loc);
      if (g.detail) extra.push(g.detail);
      if (extra.length) {
        var sub = document.createElement('span');
        sub.className = 'sub';
        sub.textContent = extra.join('  ·  ');
        td2.appendChild(sub);
      }

      tr.appendChild(td1); tr.appendChild(td2);
      tb.appendChild(tr);
    });

    $('note').textContent = rows.length
      ? 'แสดง ' + rows.length + ' รายการ เลือกเดือนแล้วกดบันทึกเป็นรูปหรือ PDF'
      : 'เดือนนี้ยังไม่มีกิจกรรมที่อนุมัติแล้วในระบบ';
  }

  function fileName(ext) {
    var m = Number($('selMonth').value);
    return 'ปฏิทินกิจกรรม-' + MONTH_FULL[m] + '-' + $('selYear').value + '.' + ext;
  }

  // ---------- ตัวเลือกเดือนและปี ----------
  var now = new Date();
  for (var i = 1; i <= 12; i++) {
    var o = document.createElement('option');
    o.value = i; o.textContent = MONTH_FULL[i];
    if (i === now.getMonth() + 1) o.selected = true;
    $('selMonth').appendChild(o);
  }
  var beNow = now.getFullYear() + 543;
  for (var y = beNow - 1; y <= beNow + 2; y++) {
    var oy = document.createElement('option');
    oy.value = y; oy.textContent = y;
    if (y === beNow) oy.selected = true;
    $('selYear').appendChild(oy);
  }
  function syncTerm() {
    $('inpTerm').value = guessTerm(Number($('selYear').value) - 543, Number($('selMonth').value));
  }
  syncTerm();

  $('selMonth').onchange = function () { syncTerm(); draw(); };
  $('selYear').onchange  = function () { syncTerm(); draw(); };
  $('inpTerm').oninput   = function () { $('pTerm').textContent = this.value; };

  $('pStamp').textContent = 'ข้อมูล ณ วันที่ ' + now.getDate() + ' ' +
    MONTH_FULL[now.getMonth() + 1] + ' ' + beNow;

  // ---------- บันทึกไฟล์ ----------
  $('btnPdf').onclick = function () { window.print(); };

  $('btnPng').onclick = function () {
    var b = $('btnPng');
    b.disabled = true; b.textContent = 'กำลังสร้างรูป';
    html2canvas($('poster'), { scale: 2, backgroundColor: '#ffffff', useCORS: true })
      .then(function (canvas) {
        var a = document.createElement('a');
        a.download = fileName('png');
        a.href = canvas.toDataURL('image/png');
        a.click();
      })
      .catch(function (err) {
        alert('สร้างรูปไม่สำเร็จ ' + err.message + '\nใช้ปุ่มบันทึกเป็น PDF แทนได้');
      })
      .then(function () { b.disabled = false; b.textContent = 'บันทึกเป็นรูป'; });
  };

  // ---------- โหลดข้อมูล ----------
  fetch(WEB_APP_URL)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (data && data.error) throw new Error(data.error);
      all = Array.isArray(data) ? data : [];
      draw();
    })
    .catch(function (err) {
      $('note').textContent = 'โหลดข้อมูลไม่สำเร็จ ' + err.message;
    });
})();
</script>
</body>
</html>
